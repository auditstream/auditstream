name: Nightly

on:
  pull_request:
    paths:
      - "crates/auditstream-pg/src/**"
      - "xtask/**"
      - "bench/capture/**"
      - ".github/workflows/nightly.yml"
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install PostgreSQL client tools (psql and pgbench)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version
          pgbench --version
      - name: Run capture benchmark smoke check
        if: github.event_name == 'pull_request'
        run: |
          cargo xtask bench \
            --duration 1 \
            --clients 2 \
            --jobs 1 \
            --bulk-runs 1 \
            --markdown-out bench-report.md \
            --json-out bench-report.json
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Run capture benchmark suite
        if: github.event_name != 'pull_request'
        run: |
          cargo xtask bench \
            --markdown-out bench-report.md \
            --json-out bench-report.json
          cat bench-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark report artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: capture-bench-report
          path: |
            bench-report.md
            bench-report.json
          retention-days: 30
