name: Feature request
description: Propose a new feature or improvement for Auditstream
type: Feature
labels:
  - "status:needs-triage"
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve, and who needs it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired CLI, engine or capture behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you considered.
    validations:
      required: false
  - type: dropdown
    id: spec_impact
    attributes:
      label: Does this change the contract in spec/?
      options:
        - No
        - Yes (additive)
        - Yes (breaking — requires an RFC)
        - Unsure
    validations:
      required: true
