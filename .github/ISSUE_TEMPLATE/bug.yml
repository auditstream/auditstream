name: Bug report
description: Report a bug in the Auditstream engine, generated SQL or CLI
type: Bug
labels:
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow [SECURITY.md](../../SECURITY.md) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear summary of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal SQL, CLI commands or fixture needed to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Auditstream version, PostgreSQL version, OS, and pooler/provider if applicable.
      placeholder: |
        - Auditstream: 0.1.0
        - PostgreSQL: 16.15
        - OS: Linux x86_64
        - Pooler/provider: PgBouncer 1.26 (transaction mode)
    validations:
      required: true
