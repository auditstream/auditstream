# Scoped ignores for .github/workflows/release.yml, which is autogenerated by
# `dist generate` (cargo-dist 0.34.0) and verified verbatim by `dist generate --check`.
# All hand-written workflows remain audited under zizmor's full default rule set.
rules:
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      - release.yml
