# Scoped ignores for .github/workflows/release.yml, which is autogenerated by
# `dist generate` (cargo-dist 0.34.0) with `allow-dirty = ["ci"]` solely to
# narrow `on.push.tags` to `auditstream-v*` (all jobs and steps remain verbatim).
# All hand-written workflows remain audited under zizmor's full default rule set.
rules:
  excessive-permissions:
    ignore:
      - release.yml
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      - release.yml
