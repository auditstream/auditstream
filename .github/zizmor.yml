# Scoped ignores for .github/workflows/release.yml, which is autogenerated by
# `dist generate` (cargo-dist 0.34.0) with `allow-dirty = ["ci"]` to narrow
# `on.push.tags` to `auditstream-v*`, tighten top-level/job permissions, drop
# `secrets: inherit`, and add tag-only guards on container publishing and
# artifact attestation. Outside those edits, the workflow (including all step
# commands and container settings) remains verbatim cargo-dist output.
# All hand-written workflows remain audited under zizmor's full default rule set.
rules:
  template-injection:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
