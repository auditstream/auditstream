[graph]
all-features = false

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained via testcontainers 0.28 in unpublished auditstream-testkit; remove once testcontainers migrates" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "sqlx", wrappers = ["auditstream-pg", "auditstream-testkit"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
