[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
homepage = "https://auditstream.dev"
repository = "https://github.com/auditstream/auditstream"
publish = false

[workspace.dependencies]
auditstream-core = { path = "crates/auditstream-core" }
auditstream-pg = { path = "crates/auditstream-pg" }
auditstream-export = { path = "crates/auditstream-export" }

anyhow = "1"
assert_cmd = "2"
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
hex = "0.4"
insta = "1"
insta-cmd = "0.6"
jsonschema = { version = "0.45", default-features = false }
libc = "0.2"
predicates = "3"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "arbitrary_precision"] }
sha2 = { version = "0.11", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "derive", "tls-rustls-ring-native-roots"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros"] }
toml = "0.9"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
await_holding_lock = "warn"

# Domain types and error variants may match their module name for clarity at call sites.
module_name_repetitions = "allow"
# Avoid noisy #[must_use] annotations on fluent builders and internal helpers.
must_use_candidate = "allow"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
