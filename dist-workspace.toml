[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.34.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "npm", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "auditstream/homebrew-tap"
# Publish Homebrew formula via dist and npm tarball via custom OIDC trusted-publishing workflow
publish-jobs = ["homebrew", "./publish-npm"]
# Publish the multi-arch container image after announce so pre-releases also publish :<version>
# without enabling pre-release publishes for Homebrew or npm
post-announce-jobs = ["./publish-image"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Enable GitHub build provenance attestations for release artifacts
github-attestations = true

# Pin GitHub Actions used by the generated release workflow to full commit SHAs
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6"

# Grant publish-image minimal permissions to check out Dockerfile, push to ghcr.io, and attest image provenance
[dist.github-custom-job-permissions.publish-image]
attestations = "write"
contents = "read"
id-token = "write"
packages = "write"
