sonar.projectKey=auditstream_auditstream
sonar.organization=auditstream

sonar.exclusions=**/tests/**,**/examples/**,crates/auditstream-testkit/**,bench/**,spec/conformance/**,docs/**

# Scoped ignores for .github/workflows/release.yml, autogenerated verbatim by `dist generate`.
sonar.issue.ignore.multicriteria=dist_perms,dist_curl_pipe
sonar.issue.ignore.multicriteria.dist_perms.ruleKey=githubactions:S8233
sonar.issue.ignore.multicriteria.dist_perms.resourceKey=.github/workflows/release.yml
sonar.issue.ignore.multicriteria.dist_curl_pipe.ruleKey=githubactions:S8482
sonar.issue.ignore.multicriteria.dist_curl_pipe.resourceKey=.github/workflows/release.yml

# Default workspace-root paths; .github/workflows/sonar.yml overrides these with
# absolute paths so Cargo workspace sub-modules auto-detected by SonarScanner resolve them.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.clippyReport.reportPaths=clippy-report.json
